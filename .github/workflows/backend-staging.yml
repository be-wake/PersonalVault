name: Deploy Backend (Staging)

on:
  push:
    branches: [staging]
    paths:
      - 'backend-dotnet/**'
      - '.github/workflows/backend-staging.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR:     ${{ vars.AZURE_ACR                 || 'pdvacrvivekverma' }}
  RG:      ${{ vars.AZURE_RG                 || 'pdv-rg' }}
  APP:     ${{ vars.BACKEND_APP_NAME_STAGING  || 'pdv-api-staging' }}
  APP_URL: ${{ vars.BACKEND_URL_STAGING      || 'https://pdv-api-staging.niceground-cc94fda7.eastus.azurecontainerapps.io' }}

jobs:
  deploy-staging:
    name: Build & Deploy Backend (.NET) — Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade -y

      - name: Build & push image via ACR cloud build
        run: |
          az acr build \
            --registry "$ACR" \
            --image pdv-backend-staging:${{ github.sha }} \
            --image pdv-backend-staging:staging \
            --file backend-dotnet/PersonalDataVault.Api/Dockerfile \
            ./backend-dotnet/PersonalDataVault.Api

      - name: Deploy new image to staging Container App
        run: |
          az containerapp update \
            --name "$APP" \
            --resource-group "$RG" \
            --image "$ACR.azurecr.io/pdv-backend-staging:${{ github.sha }}"

      - name: Print deployment summary
        run: |
          echo "## ✅ Backend (.NET, staging) deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image   | \`$ACR.azurecr.io/pdv-backend-staging:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL     | $APP_URL |" >> $GITHUB_STEP_SUMMARY
          echo "| Runtime | .NET 8 / ASP.NET Core |" >> $GITHUB_STEP_SUMMARY
