name: Build Android App

# Triggers:
#   1. Manual run — choose Android artifact type (apk / aab)
#   2. Push to main with changes under mobile-flutter/
#   3. Version tag   e.g. git tag v1.0.0 && git push --tags → release AAB
on:
  workflow_dispatch:
    inputs:
      artifact:
        description: 'Android artifact to build'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
  push:
    branches:
      - main
    paths:
      - "mobile-flutter/**"
      - ".github/workflows/mobile.yml"
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    name: Flutter Android Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve artifact type
        id: artifact
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "type=aab" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "type=${{ github.event.inputs.artifact }}" >> $GITHUB_OUTPUT
          else
            echo "type=apk" >> $GITHUB_OUTPUT
          fi

      - name: Build APK
        if: ${{ steps.artifact.outputs.type == 'apk' }}
        run: flutter build apk --release

      - name: Build App Bundle (AAB)
        if: ${{ steps.artifact.outputs.type == 'aab' }}
        run: flutter build appbundle --release

      - name: Upload APK artifact
        if: ${{ steps.artifact.outputs.type == 'apk' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile-flutter/build/app/outputs/flutter-apk/*.apk

      - name: Upload AAB artifact
        if: ${{ steps.artifact.outputs.type == 'aab' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: mobile-flutter/build/app/outputs/bundle/release/*.aab
