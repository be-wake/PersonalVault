name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC login
  contents: read

jobs:
  deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade -y

      - name: Build & push image via ACR cloud build (NEXT_PUBLIC_API_URL baked in)
        run: |
          az acr build \
            --registry pdvacrvivekverma \
            --image pdv-frontend:${{ github.sha }} \
            --image pdv-frontend:latest \
            --file frontend/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=https://pdv-api.niceground-cc94fda7.eastus.azurecontainerapps.io \
            ./frontend

      - name: Deploy new image to Container App
        run: |
          az containerapp update \
            --name pdv-web \
            --resource-group pdv-rg \
            --image pdvacrvivekverma.azurecr.io/pdv-frontend:${{ github.sha }}

      - name: Print deployment summary
        run: |
          echo "## ✅ Frontend deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`pdvacrvivekverma.azurecr.io/pdv-frontend:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL   | https://pdv-web.niceground-cc94fda7.eastus.azurecontainerapps.io |" >> $GITHUB_STEP_SUMMARY
