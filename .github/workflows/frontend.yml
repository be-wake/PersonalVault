name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC login
  contents: read

# O17 — resource names come from repo-level Actions Variables, with the current
# hand-provisioned names as fallback defaults.
env:
  ACR:         ${{ vars.AZURE_ACR         || 'pdvacrvivekverma' }}
  RG:          ${{ vars.AZURE_RG          || 'pdv-rg' }}
  APP:         ${{ vars.FRONTEND_APP_NAME || 'pdv-web' }}
  APP_URL:     ${{ vars.FRONTEND_URL      || 'https://pdv-web.niceground-cc94fda7.eastus.azurecontainerapps.io' }}
  BACKEND_URL: ${{ vars.BACKEND_URL       || 'https://pdv-api.niceground-cc94fda7.eastus.azurecontainerapps.io' }}

jobs:
  deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade -y

      - name: Build & push image via ACR cloud build (NEXT_PUBLIC_API_URL baked in)
        run: |
          az acr build \
            --registry "$ACR" \
            --image pdv-frontend:${{ github.sha }} \
            --image pdv-frontend:latest \
            --file frontend/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL="$BACKEND_URL" \
            ./frontend

      - name: Deploy new image to Container App
        run: |
          az containerapp update \
            --name "$APP" \
            --resource-group "$RG" \
            --image "$ACR.azurecr.io/pdv-frontend:${{ github.sha }}"

      - name: Print deployment summary
        run: |
          echo "## ✅ Frontend deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`$ACR.azurecr.io/pdv-frontend:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL   | $APP_URL |" >> $GITHUB_STEP_SUMMARY
