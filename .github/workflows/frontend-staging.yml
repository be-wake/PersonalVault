name: Deploy Frontend (Staging)

# O6 — Staging environment. Triggered on push to the `staging` branch so every
# PR merged to staging gets deployed before it reaches main/production.
# Also available as workflow_dispatch for ad-hoc staging deploys.
on:
  push:
    branches: [staging]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-staging.yml'
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC login
  contents: read

env:
  ACR:         ${{ vars.AZURE_ACR               || 'pdvacrvivekverma' }}
  RG:          ${{ vars.AZURE_RG               || 'pdv-rg' }}
  APP:         ${{ vars.FRONTEND_APP_NAME_STAGING || 'pdv-web-staging' }}
  APP_URL:     ${{ vars.FRONTEND_URL_STAGING   || 'https://pdv-web-staging.niceground-cc94fda7.eastus.azurecontainerapps.io' }}
  BACKEND_URL: ${{ vars.BACKEND_URL_STAGING    || 'https://pdv-api-staging.niceground-cc94fda7.eastus.azurecontainerapps.io' }}

jobs:
  deploy-staging:
    name: Build & Deploy Frontend — Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade -y

      - name: Build & push image via ACR cloud build (NEXT_PUBLIC_API_URL baked in)
        run: |
          az acr build \
            --registry "$ACR" \
            --image pdv-frontend-staging:${{ github.sha }} \
            --image pdv-frontend-staging:staging \
            --file frontend/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL="$BACKEND_URL" \
            ./frontend

      - name: Deploy new image to staging Container App
        run: |
          az containerapp update \
            --name "$APP" \
            --resource-group "$RG" \
            --image "$ACR.azurecr.io/pdv-frontend-staging:${{ github.sha }}"

      - name: Print deployment summary
        run: |
          echo "## ✅ Frontend (staging) deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`$ACR.azurecr.io/pdv-frontend-staging:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL   | $APP_URL |" >> $GITHUB_STEP_SUMMARY
