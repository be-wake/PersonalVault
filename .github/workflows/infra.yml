name: Provision Azure Infrastructure

on:
  workflow_dispatch:          # Run manually from GitHub Actions UI
    inputs:
      app_suffix:
        description: 'Unique suffix for resource names (e.g. vivekverma)'
        required: true
        default: 'vivekverma'
      location:
        description: 'Azure region'
        required: true
        default: 'eastus'

permissions:
  id-token: write   # Required for OIDC login
  contents: read

jobs:
  provision:
    name: Provision Azure Resources
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create resource group
        run: |
          az group create \
            --name ${{ vars.AZURE_RG }} \
            --location ${{ github.event.inputs.location }} \
            --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-if (preview changes)
        # Best practice: always validate Bicep with what-if before apply.
        run: |
          az deployment group what-if \
            --resource-group ${{ vars.AZURE_RG }} \
            --template-file infra/main.bicep \
            --parameters \
                appSuffix=${{ github.event.inputs.app_suffix }} \
                pgAdminPassword='${{ secrets.PG_ADMIN_PASSWORD }}' \
                jwtSecret='${{ secrets.JWT_SECRET }}' \
                jwtRefreshSecret='${{ secrets.JWT_REFRESH_SECRET }}' \
                stepUpSecret='${{ secrets.STEPUP_SECRET }}' \
                webhookHmacSecret='${{ secrets.WEBHOOK_HMAC_SECRET }}' \
                fieldKekBase64='${{ secrets.FIELD_KEK_BASE64 }}' \
            --no-pretty-print || true

      - name: Deploy Bicep infrastructure
        id: deploy
        run: |
          output=$(az deployment group create \
            --resource-group ${{ vars.AZURE_RG }} \
            --template-file infra/main.bicep \
            --parameters \
                appSuffix=${{ github.event.inputs.app_suffix }} \
                pgAdminPassword='${{ secrets.PG_ADMIN_PASSWORD }}' \
                jwtSecret='${{ secrets.JWT_SECRET }}' \
                jwtRefreshSecret='${{ secrets.JWT_REFRESH_SECRET }}' \
                stepUpSecret='${{ secrets.STEPUP_SECRET }}' \
                webhookHmacSecret='${{ secrets.WEBHOOK_HMAC_SECRET }}' \
                fieldKekBase64='${{ secrets.FIELD_KEK_BASE64 }}' \
            --output json)

          # Extract every output the downstream deploy workflows need.
          o=$(echo "$output" | jq -c '.properties.outputs')

          echo "$o" | jq .   # logged for traceability

          extract() { echo "$o" | jq -r ".$1.value"; }

          echo "backend_url=$(extract backendUrl)"             >> $GITHUB_OUTPUT
          echo "frontend_url=$(extract frontendUrl)"           >> $GITHUB_OUTPUT
          echo "backend_app_name=$(extract backendAppName)"    >> $GITHUB_OUTPUT
          echo "frontend_app_name=$(extract frontendAppName)"  >> $GITHUB_OUTPUT
          echo "acr_name=$(extract acrName)"                   >> $GITHUB_OUTPUT
          echo "acr_login_server=$(extract acrLoginServer)"    >> $GITHUB_OUTPUT
          echo "key_vault_name=$(extract keyVaultName)"        >> $GITHUB_OUTPUT
          echo "container_env_name=$(extract containerEnvName)" >> $GITHUB_OUTPUT

      - name: Print deployment summary
        run: |
          {
            echo "## ✅ Infrastructure provisioned"
            echo ""
            echo "| Resource | Value |"
            echo "|---|---|"
            echo "| Backend URL        | ${{ steps.deploy.outputs.backend_url }} |"
            echo "| Frontend URL       | ${{ steps.deploy.outputs.frontend_url }} |"
            echo "| Backend app name   | \`${{ steps.deploy.outputs.backend_app_name }}\` |"
            echo "| Frontend app name  | \`${{ steps.deploy.outputs.frontend_app_name }}\` |"
            echo "| ACR                | \`${{ steps.deploy.outputs.acr_login_server }}\` |"
            echo "| Key Vault          | \`${{ steps.deploy.outputs.key_vault_name }}\` |"
            echo "| Container Env      | \`${{ steps.deploy.outputs.container_env_name }}\` |"
            echo ""
            echo "### Next step — set these as GitHub Actions **Variables** (Settings → Variables → Actions)"
            echo "so backend.yml / frontend.yml stop hard-coding resource names:"
            echo ""
            echo "\`\`\`"
            echo "AZURE_RG          = ${{ vars.AZURE_RG }}"
            echo "AZURE_ACR         = ${{ steps.deploy.outputs.acr_name }}"
            echo "BACKEND_APP_NAME  = ${{ steps.deploy.outputs.backend_app_name }}"
            echo "FRONTEND_APP_NAME = ${{ steps.deploy.outputs.frontend_app_name }}"
            echo "BACKEND_URL       = ${{ steps.deploy.outputs.backend_url }}"
            echo "FRONTEND_URL      = ${{ steps.deploy.outputs.frontend_url }}"
            echo "\`\`\`"
          } >> $GITHUB_STEP_SUMMARY
