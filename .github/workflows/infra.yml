name: Provision Azure Infrastructure

on:
  workflow_dispatch:          # Run manually from GitHub Actions UI
    inputs:
      app_suffix:
        description: 'Unique suffix for resource names (e.g. vivekverma)'
        required: true
        default: 'vivekverma'
      location:
        description: 'Azure region'
        required: true
        default: 'eastus'

permissions:
  id-token: write   # Required for OIDC login
  contents: read

jobs:
  provision:
    name: Provision Azure Resources
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create resource group
        run: |
          az group create \
            --name ${{ vars.AZURE_RG }} \
            --location ${{ github.event.inputs.location }} \
            --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep infrastructure
        id: deploy
        run: |
          output=$(az deployment group create \
            --resource-group ${{ vars.AZURE_RG }} \
            --template-file infra/main.bicep \
            --parameters \
                appSuffix=${{ github.event.inputs.app_suffix }} \
                pgAdminPassword='${{ secrets.PG_ADMIN_PASSWORD }}' \
                jwtSecret='${{ secrets.JWT_SECRET }}' \
                jwtRefreshSecret='${{ secrets.JWT_REFRESH_SECRET }}' \
                stepUpSecret='${{ secrets.STEPUP_SECRET }}' \
                webhookHmacSecret='${{ secrets.WEBHOOK_HMAC_SECRET }}' \
                fieldKekBase64='${{ secrets.FIELD_KEK_BASE64 }}' \
            --output json)

          echo "$output" | jq '.properties.outputs'

          burl=$(echo "$output"  | jq -r '.properties.outputs.backendFqdn.value')
          furl=$(echo "$output"  | jq -r '.properties.outputs.frontendFqdn.value')
          acr=$(echo "$output"   | jq -r '.properties.outputs.acrLoginServer.value')
          kv=$(echo "$output"    | jq -r '.properties.outputs.keyVaultName.value')

          echo "backend_url=https://$burl"   >> $GITHUB_OUTPUT
          echo "frontend_url=https://$furl"  >> $GITHUB_OUTPUT
          echo "acr=$acr"                    >> $GITHUB_OUTPUT
          echo "kv=$kv"                      >> $GITHUB_OUTPUT

      - name: Print deployment summary
        run: |
          echo "## ✅ Infrastructure provisioned" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend URL   | ${{ steps.deploy.outputs.backend_url }} |"  >> $GITHUB_STEP_SUMMARY
          echo "| Frontend URL  | ${{ steps.deploy.outputs.frontend_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ACR           | \`${{ steps.deploy.outputs.acr }}\` |"      >> $GITHUB_STEP_SUMMARY
          echo "| Key Vault     | \`${{ steps.deploy.outputs.kv }}\` |"       >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next step" >> $GITHUB_STEP_SUMMARY
          echo "Set these as GitHub Actions **Variables** so the deploy workflows target this stack:" >> $GITHUB_STEP_SUMMARY
          echo "- \`BACKEND_URL\`  = \`${{ steps.deploy.outputs.backend_url }}\`"  >> $GITHUB_STEP_SUMMARY
          echo "- \`FRONTEND_URL\` = \`${{ steps.deploy.outputs.frontend_url }}\`" >> $GITHUB_STEP_SUMMARY
