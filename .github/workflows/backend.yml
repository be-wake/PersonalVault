name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'personal-data-vault/backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:   # Allow manual re-deploy

permissions:
  id-token: write   # Required for OIDC login
  contents: read

jobs:
  deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: personal-data-vault/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: personal-data-vault/backend/package-lock.json

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.BACKEND_APP_NAME }}
          package: ./personal-data-vault/backend
