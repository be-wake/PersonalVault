name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC login
  contents: read

# O17 — resource names come from repo-level Actions Variables, with the current
# hand-provisioned names as fallback defaults so the pipeline keeps working even
# before the variables are set. Set these under Settings → Variables → Actions.
env:
  ACR:     ${{ vars.AZURE_ACR        || 'pdvacrvivekverma' }}
  RG:      ${{ vars.AZURE_RG         || 'pdv-rg' }}
  APP:     ${{ vars.BACKEND_APP_NAME || 'pdv-api' }}
  APP_URL: ${{ vars.BACKEND_URL      || 'https://pdv-api.niceground-cc94fda7.eastus.azurecontainerapps.io' }}

jobs:
  deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade -y

      - name: Build & push image via ACR cloud build (no Docker needed)
        run: |
          az acr build \
            --registry "$ACR" \
            --image pdv-backend:${{ github.sha }} \
            --image pdv-backend:latest \
            --file backend/Dockerfile \
            ./backend

      - name: Deploy new image to Container App
        run: |
          az containerapp update \
            --name "$APP" \
            --resource-group "$RG" \
            --image "$ACR.azurecr.io/pdv-backend:${{ github.sha }}"

      - name: Print deployment summary
        run: |
          echo "## ✅ Backend deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`$ACR.azurecr.io/pdv-backend:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL   | $APP_URL |" >> $GITHUB_STEP_SUMMARY
