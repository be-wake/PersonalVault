name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC login
  contents: read

jobs:
  deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade -y

      - name: Build & push image via ACR cloud build (no Docker needed)
        run: |
          az acr build \
            --registry pdvacrvivekverma \
            --image pdv-backend:${{ github.sha }} \
            --image pdv-backend:latest \
            --file backend/Dockerfile \
            ./backend

      - name: Deploy new image to Container App
        run: |
          az containerapp update \
            --name pdv-api \
            --resource-group pdv-rg \
            --image pdvacrvivekverma.azurecr.io/pdv-backend:${{ github.sha }}

      - name: Print deployment summary
        run: |
          echo "## ✅ Backend deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`pdvacrvivekverma.azurecr.io/pdv-backend:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL   | https://pdv-api.niceground-cc94fda7.eastus.azurecontainerapps.io |" >> $GITHUB_STEP_SUMMARY
