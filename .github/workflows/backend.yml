name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend-dotnet/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC login
  contents: read

env:
  ACR:          ${{ vars.AZURE_ACR        || 'pdvacrvivekverma' }}
  RG:           ${{ vars.AZURE_RG         || 'pdv-rg' }}
  APP:          ${{ vars.BACKEND_APP_NAME || 'pdv-api' }}
  APP_URL:      ${{ vars.BACKEND_URL      || 'https://pdv-api.niceground-cc94fda7.eastus.azurecontainerapps.io' }}
  FRONTEND_URL: ${{ vars.FRONTEND_URL     || 'https://pdv-web.niceground-cc94fda7.eastus.azurecontainerapps.io' }}

jobs:
  deploy:
    name: Build & Deploy Backend (.NET)
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade -y

      # The .NET backend runs EnsureCreated() + idempotent ALTER TABLE migrations
      # at startup, so no separate migration step is needed here.
      # If you later want EF Core migrations instead, add:
      #   dotnet tool install dotnet-ef && dotnet ef database update

      - name: Build & push image via ACR cloud build (no Docker daemon needed)
        run: |
          az acr build \
            --registry "$ACR" \
            --image pdv-backend:${{ github.sha }} \
            --image pdv-backend:latest \
            --file backend-dotnet/PersonalDataVault.Api/Dockerfile \
            ./backend-dotnet/PersonalDataVault.Api

      - name: Deploy new image to Container App
        run: |
          az containerapp update \
            --name "$APP" \
            --resource-group "$RG" \
            --image "$ACR.azurecr.io/pdv-backend:${{ github.sha }}" \
            --set-env-vars "CORS_ORIGINS=$FRONTEND_URL"

      - name: Wait for revision to be healthy
        run: |
          echo "Waiting up to 3 minutes for new revision to become active…"
          for i in $(seq 1 18); do
            STATUS=$(az containerapp revision list \
              --name "$APP" \
              --resource-group "$RG" \
              --query "[0].properties.healthState" -o tsv 2>/dev/null || echo "unknown")
            echo "  Attempt $i: healthState = $STATUS"
            if [ "$STATUS" = "Healthy" ]; then
              echo "Revision is healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Warning: revision did not report Healthy within 3 minutes. Check Container Apps logs."

      - name: Print deployment summary
        run: |
          echo "## ✅ Backend (.NET) deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image  | \`$ACR.azurecr.io/pdv-backend:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL    | $APP_URL |" >> $GITHUB_STEP_SUMMARY
          echo "| Runtime | .NET 8 / ASP.NET Core |" >> $GITHUB_STEP_SUMMARY
