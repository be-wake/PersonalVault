# O2 — Lint CI: runs ESLint on backend, Next.js lint on frontend, and Expo ESLint
# on mobile for every push to main and every pull request targeting main.
name: Lint

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "mobile/**"
      - ".github/workflows/lint.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "mobile/**"
      - ".github/workflows/lint.yml"

jobs:
  detect-changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changes by directory
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/lint.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/lint.yml'
            mobile:
              - 'mobile/**'
              - '.github/workflows/lint.yml'

  # ── Backend (Node.js / Express — plain JS) ──────────────────────────────────
  lint-backend:
    name: Lint Backend
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

  # ── Frontend (Next.js — TypeScript) ─────────────────────────────────────────
  lint-frontend:
    name: Lint Frontend
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Next.js lint
        run: npm run lint

  # ── Mobile (Expo SDK 54 / React Native — TypeScript) ────────────────────────
  lint-mobile:
    name: Lint Mobile
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        # legacy-peer-deps mirrors .npmrc so optional peer-dep conflicts are skipped
        run: npm ci --legacy-peer-deps

      - name: ESLint (Expo)
        run: npm run lint
