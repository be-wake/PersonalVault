# O2 — Lint / build CI: dotnet build on backend, Next.js lint on frontend,
# and Flutter analyze on mobile-flutter for every push to main/staging and
# every pull request targeting them.
name: Lint

on:
  push:
    branches: [main, staging]
    paths:
      - "backend-dotnet/**"
      - "frontend/**"
      - "mobile-flutter/**"
      - ".github/workflows/lint.yml"
  pull_request:
    branches: [main, staging]
    paths:
      - "backend-dotnet/**"
      - "frontend/**"
      - "mobile-flutter/**"
      - ".github/workflows/lint.yml"

jobs:
  detect-changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changes by directory
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'backend-dotnet/**'
              - '.github/workflows/lint.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/lint.yml'
            mobile:
              - 'mobile-flutter/**'
              - '.github/workflows/lint.yml'

  # ── Backend (.NET 8 / ASP.NET Core) ─────────────────────────────────────────
  build-backend:
    name: Build Backend (.NET)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: dotnet restore backend-dotnet/PersonalDataVault.sln

      - name: Build (no warnings treated as errors in CI)
        run: dotnet build backend-dotnet/PersonalDataVault.sln --no-restore -c Release

  # ── Frontend (Next.js — TypeScript) ─────────────────────────────────────────
  lint-frontend:
    name: Lint Frontend
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Next.js lint
        run: npm run lint

  # ── Mobile (Flutter — Dart) ─────────────────────────────────────────────────
  analyze-mobile:
    name: Analyze Mobile (Flutter)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-flutter

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze
