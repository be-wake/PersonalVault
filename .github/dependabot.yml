# O3 — Dependabot: weekly PRs for npm packages (backend, frontend, mobile) and
# GitHub Actions. Open-PR caps prevent queue flooding.
version: 2

updates:
  # Backend (Node.js / Express)
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    ignore:
      # Major runtime version bumps need manual review
      - dependency-name: pg
        update-types: [version-update:semver-major]
      - dependency-name: express
        update-types: [version-update:semver-major]

  # Frontend (Next.js)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    ignore:
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]

  # Mobile (Expo / React Native)
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - mobile
    ignore:
      # ── Expo ecosystem ────────────────────────────────────────────────────────
      # All expo-* packages use the Expo SDK version as their major version
      # (expo-font 14.x = SDK 54, expo-font 56.x = SDK 56). Bumping any of them
      # independently of the SDK upgrade breaks native module compatibility.
      # Only update the entire Expo ecosystem together via a deliberate SDK upgrade.
      - dependency-name: expo
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: expo-*
        update-types: [version-update:semver-major, version-update:semver-minor]
      # ── React / React Native ─────────────────────────────────────────────────
      # react-native ships react-native-renderer compiled at a specific React
      # version. Bumping react independently breaks the bridge at runtime.
      - dependency-name: react-native
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      # ── Expo Go pre-compiled native modules ──────────────────────────────────
      # Expo Go ships pre-built native modules locked to specific version ranges
      # defined in expo/bundledNativeModules.json. Bumping these packages beyond
      # those ranges causes ABI mismatches (e.g. java.lang.String cannot be cast
      # to java.lang.Boolean in Fabric's setProperty). Pin to SDK 54 ranges:
      # react-native-screens ~4.16.0, react-native-safe-area-context ~5.6.0.
      - dependency-name: react-native-screens
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react-native-safe-area-context
        update-types: [version-update:semver-major, version-update:semver-minor]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
