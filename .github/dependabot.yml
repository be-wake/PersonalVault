# O3 — Dependabot: weekly PRs for npm packages (backend, frontend), pub
# dependencies (mobile-flutter), and GitHub Actions.
# GitHub Actions. Open-PR caps prevent queue flooding.
version: 2

updates:
  # Backend (Node.js / Express)
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    ignore:
      # Major runtime version bumps need manual review
      - dependency-name: pg
        update-types: [version-update:semver-major]
      - dependency-name: express
        update-types: [version-update:semver-major]

  # Frontend (Next.js)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    ignore:
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]

  # Mobile (Flutter / Dart pub)
  - package-ecosystem: pub
    directory: /mobile-flutter
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - mobile-flutter

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
