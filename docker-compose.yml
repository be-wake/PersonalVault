# Local-development convenience stack.
# Starts a PostgreSQL 16 instance that matches the credentials in
# backend-dotnet/PersonalDataVault.Api/Properties/launchSettings.json.
#
# Usage:
#   docker compose up -d       # start Postgres in the background
#   docker compose down        # stop and remove the container
#   docker compose down -v     # also wipe the data volume
#
# Note: if you already have PostgreSQL 17 installed locally and the `pdv`
# database created (see README), you don't need Docker at all.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     pdvadmin
      POSTGRES_PASSWORD: devpassword123
      POSTGRES_DB:       pdv
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdvadmin -d pdv"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
